[project]
name = "qfeed-gpu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "accelerate>=1.10.1",
    "fastapi>=0.128.0",
    "faster-whisper>=1.2.1",
    "pydub>=0.25.1",
    "python-multipart>=0.0.20",
    "ruff>=0.14.14",
    "torch>=2.8.0",
    "transformers==4.46.0",
    "uvicorn[standard]>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "S"]
ignore = ["E501"]

